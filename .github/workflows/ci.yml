name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json (pnpm@12.14.0).

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Test operational scripts
        run: node --test scripts/*.test.mjs

      # Fails the build when a credential is committed to a tracked file.
      - name: Secret scan
        run: pnpm scan:secrets

      - name: Build (turbo, with output caching)
        run: pnpm turbo run build

      # Wrangler dry-run build for apps/web without Cloudflare credentials.
      # If this ever requires auth (e.g. specific config), remove this step
      # and rely on `pnpm turbo run build` (vite build) above only.
      - name: Wrangler dry-run build (apps/web)
        run: pnpm --filter @saas/web exec wrangler deploy --dry-run --outdir dist
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""

      - name: Configure disposable local stack
        run: |
          pnpm wizard --yes
          pnpm bootstrap

      - name: HTTP integration smoke
        run: node scripts/ci-smoke.mjs
        timeout-minutes: 5

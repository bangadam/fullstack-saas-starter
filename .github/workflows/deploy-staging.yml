name: Deploy Staging

# Manual dispatch only. Configure required reviewers on the staging environment.
on:
  workflow_dispatch:
    inputs:
      confirm_environment:
        description: Type staging to approve the target
        required: true
        type: string
      migrations_reviewed:
        description: SQL reviewed, resources and Worker secrets already provisioned
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_environment == 'staging' && inputs.migrations_reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Offline deployment preflight
        run: pnpm deploy:staging --preflight
      - name: Quality gates
        run: pnpm turbo run lint typecheck test
      - run: pnpm scan:secrets
      - name: Build, migrate, deploy API/jobs/web, and smoke
        run: pnpm deploy:staging --confirm staging --migrations-reviewed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
